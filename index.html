<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Calculateur Patrimoine</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
--bg:#f5f4f0;
--surface:#fff;
--border:#e0ddd6;
--text:#1a1a18;
--muted:#888880;
--accent:#2d6a4f;
--mono:'DM Mono',monospace;
--sans:'DM Sans',sans-serif;
}

body{
font-family:var(--sans);
background:var(--bg);
color:var(--text);
padding:24px;
display:flex;
justify-content:center;
}

.app{width:100%;max-width:420px}

/* HEADER + MENU */
header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

h1{font-family:var(--mono);font-size:13px;color:var(--muted);text-transform:uppercase}
p{font-size:20px;font-weight:600}

.menu-btn{
border:1px solid var(--border);
background:var(--surface);
padding:8px 10px;
border-radius:8px;
cursor:pointer;
}

.menu{
display:none;
background:var(--surface);
border:1px solid var(--border);
border-radius:10px;
padding:10px;
margin-bottom:15px;
}

.menu button{
width:100%;
padding:10px;
border:none;
background:none;
text-align:left;
cursor:pointer;
font-family:var(--mono);
}

.menu button:hover{background:#f2f2f2}

/* TABLE */
.table-wrap{
background:var(--surface);
border:1px solid var(--border);
border-radius:12px;
overflow:hidden;
margin-top:15px;
}

.table-header,.row{
display:grid;
grid-template-columns:1fr 1fr 1fr;
padding:10px;
}

.table-header{
background:var(--text);
color:#fff;
font-family:var(--mono);
font-size:11px;
text-transform:uppercase;
}

.row{border-bottom:1px solid var(--border)}

.row-label{font-family:var(--mono)}

.row-qty{text-align:center}
.row-sub{text-align:right}

/* ACCOUNTS */
.accounts{
margin-top:20px;
background:var(--surface);
border:1px solid var(--border);
border-radius:12px;
padding:12px;
}

.account{
display:flex;
justify-content:space-between;
margin:6px 0;
font-family:var(--mono);
}

.add-account{
margin-top:10px;
display:flex;
gap:8px;
}

.add-account input{
flex:1;
padding:8px;
border:1px solid var(--border);
border-radius:8px;
}

/* TOTALS */
.total{
margin-top:15px;
background:var(--surface);
border:1px solid var(--border);
border-radius:12px;
padding:12px;
font-family:var(--mono);
}

button{cursor:pointer}
</style>
</head>

<body>
<div class="app">

<header>
<div>
<h1>Patrimoine</h1>
<p>Cash & Banque 💶</p>
</div>
<button class="menu-btn" onclick="toggleMenu()">☰</button>
</header>

<!-- MENU -->
<div class="menu" id="menu">
<button onclick="exportPDF()">📄 Exporter PDF</button>
</div>

<!-- CASH -->
<div class="table-wrap">
<div class="table-header">
<span>Billet / Pièce</span>
<span>Qté</span>
<span>Total</span>
</div>
<div id="rows"></div>
</div>

<!-- ACCOUNTS -->
<div class="accounts">
<h3 style="font-family:var(--mono);font-size:12px;margin-bottom:8px;">Comptes bancaires</h3>

<div id="accounts-list"></div>

<div class="add-account">
<input id="acc-name" placeholder="Nom compte"/>
<input id="acc-value" type="number" placeholder="€"/>
<button onclick="addAccount()">+</button>
</div>
</div>

<!-- TOTAL -->
<div class="total">
Cash: <span id="cash-total">0</span> €<br>
Banque: <span id="bank-total">0</span> €<br>
<b>Total: <span id="global-total">0</span> €</b>
</div>

<canvas id="chart" style="margin-top:15px"></canvas>

</div>

<script>
/* CASH DENOMINATIONS (modifié) */
const denominations=[
{label:"0,10 €",value:0.10},
{label:"0,20 €",value:0.20},
{label:"0,50 €",value:0.50},
{label:"1 €",value:1},
{label:"2 €",value:2},
{label:"5 €",value:5},
{label:"10 €",value:10},
{label:"20 €",value:20},
{label:"50 €",value:50},
{label:"100 €",value:100},
{label:"200 €",value:200},
{label:"500 €",value:500}
];

const STORAGE="patrimoine-v1";

let data=JSON.parse(localStorage.getItem(STORAGE)||"{}");
let quantities=data.quantities||Array(denominations.length).fill(0);
let accounts=data.accounts||[];

function save(){
localStorage.setItem(STORAGE,JSON.stringify({quantities,accounts}));
update();
}

/* RENDER CASH */
const rows=document.getElementById("rows");

denominations.forEach((d,i)=>{
const r=document.createElement("div");
r.className="row";
r.innerHTML=`
<div class="row-label">${d.label}</div>
<div class="row-qty">
<input type="number" value="${quantities[i]}" onchange="setQty(${i},this.value)" style="width:50px;text-align:center"/>
</div>
<div class="row-sub" id="sub-${i}">0</div>`;
rows.appendChild(r);
});

function setQty(i,v){
quantities[i]=parseInt(v)||0;
save();
}

/* ACCOUNTS */
function renderAccounts(){
const el=document.getElementById("accounts-list");
el.innerHTML="";
accounts.forEach((a,i)=>{
el.innerHTML+=`
<div class="account">
<span>${a.name}</span>
<span>${a.value} €</span>
</div>`;
});
}

function addAccount(){
const name=document.getElementById("acc-name").value;
const value=parseFloat(document.getElementById("acc-value").value);
if(!name||!value)return;
accounts.push({name,value});
save();
}

/* TOTALS */
function update(){
let cash=0;

quantities.forEach((q,i)=>{
const val=q*denominations[i].value;
cash+=val;
document.getElementById("sub-"+i).innerText=val.toFixed(2)+" €";
});

let bank=accounts.reduce((s,a)=>s+a.value,0);

document.getElementById("cash-total").innerText=cash.toFixed(2);
document.getElementById("bank-total").innerText=bank.toFixed(2);
document.getElementById("global-total").innerText=(cash+bank).toFixed(2);

renderAccounts();
drawChart(cash,bank);
}

/* MENU */
function toggleMenu(){
document.getElementById("menu").style.display=
document.getElementById("menu").style.display==="block"?"none":"block";
}

/* PDF EXPORT */
function exportPDF(){
const {jsPDF}=window.jspdf;
const doc=new jsPDF();

doc.setFont("helvetica","bold");
doc.text("Patrimoine financier",20,20);

doc.setFont("helvetica","normal");
doc.text("Date: "+new Date().toLocaleString(),20,30);

doc.text("Cash: "+document.getElementById("cash-total").innerText+" €",20,50);
doc.text("Banque: "+document.getElementById("bank-total").innerText+" €",20,60);
doc.text("Total: "+document.getElementById("global-total").innerText+" €",20,70);

doc.save("patrimoine.pdf");
}

/* CHART */
let chart;
function drawChart(cash,bank){
const ctx=document.getElementById("chart");

if(chart)chart.destroy();

chart=new Chart(ctx,{
type:"pie",
data:{
labels:["Cash","Banque"],
datasets:[{data:[cash,bank]}]
}
});
}

update();
</script>
</body>
</html>
