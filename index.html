<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculateur Euro</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --border: #e0ddd6;
      --text: #1a1a18;
      --muted: #888880;
      --accent: #2d6a4f;
      --mono: 'DM Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 16px 64px;
    }

    .app {
      width: 100%;
      max-width: 420px;
    }

    header {
      margin-bottom: 28px;
    }

    header h1 {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    header p {
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
    }

    .goal-section {
      margin-top: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
    }

    .goal-input {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .goal-input label {
      font-family: var(--mono);
      font-size: 13.5px;
      color: var(--muted);
      white-space: nowrap;
    }

    .goal-input input {
      flex: 1;
      min-width: 120px;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 18px;
      text-align: right;
    }

    .progress-container { margin-top: 14px; }
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 8px;
      font-family: var(--mono);
    }

    .progress-bar {
      height: 8px;
      background: #e0ddd6;
      border-radius: 9999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #4ade80);
      transition: width 0.3s ease;
    }

    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      margin-top: 20px;
    }

    .table-header {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      padding: 10px 16px;
      background: var(--text);
      color: #fff;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
    }

    .row:last-child { border-bottom: none; }

    .row-label {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 500;
      padding: 14px 0;
    }

    .row-qty {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .qty-btn {
      width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--border);
      background: transparent; cursor: pointer; font-size: 16px;
    }

    .qty-input {
      width: 36px; text-align: center; border: none; background: transparent;
      font-family: var(--mono); font-size: 15px;
    }

    .row-sub {
      font-family: var(--mono);
      font-size: 14px;
      color: var(--muted);
      text-align: right;
      padding: 14px 0;
    }
    .row-sub.has-value { color: var(--accent); font-weight: 500; }

    .totals-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .total-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
    }

    .total-label {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .total-amount {
      font-family: var(--mono);
      font-size: 23px;
      font-weight: 500;
      color: var(--text);
    }

    .pie-container {
      margin: 32px 0 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .pie-title {
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .bank-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-top: 20px;
    }

    .reset-btn, .export-btn {
      margin-top: 14px;
      width: 100%;
      padding: 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: transparent;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
    }

    .export-btn {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      margin-top: 8px;
    }

    .reset-btn:hover { border-color: #c0392b; color: #c0392b; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>Calculateur</h1>
    <p>Compter mon cash 💶</p>
  </header>

  <div class="goal-section">
    <div class="goal-input">
      <label>Objectif d'épargne :</label>
      <input type="number" id="goal-input" value="0" min="0" step="10" oninput="updateGoal()">
    </div>
    <div class="progress-container" id="progress-container" style="display: none;">
      <div class="progress-info">
        <span id="progress-text">0 % atteint</span>
        <span id="goal-remaining">0,00 € restant</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
      </div>
    </div>
  </div>

  <div class="table-wrap">
    <div class="table-header">
      <span>Billet / Pièce</span>
      <span>Qté</span>
      <span>Sous-total</span>
    </div>
    <div id="rows"></div>
  </div>

  <div class="totals-grid">
    <div class="total-section">
      <span class="total-label">Total Pièces</span>
      <span class="total-amount" id="total-coins">0,00 €</span>
    </div>
    <div class="total-section">
      <span class="total-label">Total Billets</span>
      <span class="total-amount" id="total-bills">0,00 €</span>
    </div>
  </div>

  <div class="total-section">
    <span class="total-label">Total Général</span>
    <span class="total-amount" id="total">0,00 €</span>
  </div>

  <div class="pie-container">
    <div class="pie-title">Répartition complète</div>
    <canvas id="pieChart" width="300" height="300"></canvas>
  </div>

  <!-- Comptes Bancaires -->
  <div class="bank-section">
    <h3 style="font-family:var(--mono); font-size:14px; margin-bottom:12px; color:var(--muted);">Comptes Bancaires</h3>
    <div id="bank-accounts-list"></div>
    
    <div style="margin-top:16px; display:grid; grid-template-columns:1fr 1fr; gap:8px;">
      <input type="text" id="bank-name" placeholder="Nom du compte" style="padding:10px; border:1.5px solid var(--border); border-radius:8px;">
      <input type="number" id="bank-amount" placeholder="Montant €" step="0.01" style="padding:10px; border:1.5px solid var(--border); border-radius:8px;">
    </div>
    <button onclick="addBankAccount()" style="width:100%; margin-top:10px; padding:12px; background:var(--accent); color:white; border:none; border-radius:8px; font-family:var(--mono);">+ Ajouter compte</button>
  </div>

  <button class="export-btn" onclick="exportToPDF()">📄 Exporter en PDF</button>
  <button class="reset-btn" onclick="resetAll()">↺ &nbsp;Tout réinitialiser</button>
  <p id="last-saved" style="margin-top:10px; text-align:center; font-family:'DM Mono',monospace; font-size:11px; color:#aaa;"></p>
</div>

<script>
  const denominations = [
    { label: "0,10 €", value: 0.10, type: "coin" },
    { label: "0,20 €", value: 0.20, type: "coin" },
    { label: "0,50 €", value: 0.50, type: "coin" },
    { label: "1,00 €", value: 1, type: "coin" },
    { label: "2,00 €", value: 2, type: "coin" },
    { label: "5,00 €", value: 5, type: "bill" },
    { label: "10,00 €", value: 10, type: "bill" },
    { label: "20,00 €", value: 20, type: "bill" },
    { label: "50,00 €", value: 50, type: "bill" },
    { label: "100,00 €", value: 100, type: "bill" },
    { label: "200,00 €", value: 200, type: "bill" },
    { label: "500,00 €", value: 500, type: "bill" },
  ];

  const STORAGE_KEY = 'euro-calculator-v5';

  let quantities = new Array(denominations.length).fill(0);
  let savingsGoal = 0;
  let bankAccounts = [];
  let pieChart;

  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  if (saved.quantities) quantities = saved.quantities;
  if (saved.savingsGoal) savingsGoal = saved.savingsGoal;
  if (saved.bankAccounts) bankAccounts = saved.bankAccounts;

  function fmt(n) {
    return n.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      quantities, savingsGoal, bankAccounts,
      updatedAt: new Date().toISOString()
    }));
  }

  function calculateTotals() {
    let totalCoins = 0, totalBills = 0, totalCash = 0;
    denominations.forEach((d, i) => {
      const amount = d.value * quantities[i];
      totalCash += amount;
      if (d.type === "coin") totalCoins += amount;
      else totalBills += amount;
    });
    const totalBank = bankAccounts.reduce((sum, acc) => sum + acc.amount, 0);
    return { totalCoins, totalBills, totalCash, totalBank, grandTotal: totalCash + totalBank };
  }

  function updateTotals() {
    const { totalCoins, totalBills, totalCash, totalBank, grandTotal } = calculateTotals();
    document.getElementById('total').textContent = fmt(grandTotal);
    document.getElementById('total-coins').textContent = fmt(totalCoins);
    document.getElementById('total-bills').textContent = fmt(totalBills);

    denominations.forEach((_, i) => {
      const sub = document.getElementById('sub-' + i);
      const val = denominations[i].value * quantities[i];
      sub.textContent = val > 0 ? fmt(val) : '—';
      sub.className = 'row-sub' + (val > 0 ? ' has-value' : '');
    });

    updateGoalDisplay();
    updatePieChart();
    saveData();
  }

  function updateGoal() {
    savingsGoal = parseFloat(document.getElementById('goal-input').value) || 0;
    updateTotals();
  }

  function updateGoalDisplay() {
    const { totalCash } = calculateTotals();
    const container = document.getElementById('progress-container');
    if (savingsGoal > 0) {
      container.style.display = 'block';
      const perc = Math.min(100, Math.round((totalCash / savingsGoal) * 100));
      document.getElementById('progress-fill').style.width = perc + '%';
      document.getElementById('progress-text').textContent = perc + ' % atteint';
      document.getElementById('goal-remaining').textContent = fmt(Math.max(0, savingsGoal - totalCash)) + ' restant';
    } else {
      container.style.display = 'none';
    }
  }

  function updatePieChart() {
    const { totalCoins, totalBills, totalCash, totalBank } = calculateTotals();
    const ctx = document.getElementById('pieChart');
    if (pieChart) pieChart.destroy();

    const data = [], labels = [], colors = [];

    if (totalCoins > 0) { data.push(totalCoins); labels.push('Pièces'); colors.push('#4ade80'); }
    if (totalBills > 0) { data.push(totalBills); labels.push('Billets'); colors.push('#2d6a4f'); }
    if (totalBank > 0) { data.push(totalBank); labels.push('Comptes Bancaires'); colors.push('#60a5fa'); }
    if (savingsGoal > 0) {
      const rem = Math.max(0, savingsGoal - totalCash);
      if (rem > 0) { data.push(rem); labels.push('Vers objectif'); colors.push('#e0ddd6'); }
    }

    if (data.length === 0) { data.push(1); labels.push('Aucun montant'); colors.push('#e0ddd6'); }

    pieChart = new Chart(ctx, {
      type: 'pie',
      data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 3, borderColor: '#fff' }] },
      options: { 
        responsive: true, 
        plugins: { 
          legend: { position: 'bottom' }, 
          tooltip: { callbacks: { label: c => fmt(c.raw) } } 
        } 
      }
    });
  }

  function changeQty(i, delta) {
    quantities[i] = Math.max(0, quantities[i] + delta);
    document.getElementById('qty-' + i).value = quantities[i];
    updateTotals();
  }

  function onInput(i) {
    quantities[i] = Math.max(0, parseInt(document.getElementById('qty-' + i).value) || 0);
    document.getElementById('qty-' + i).value = quantities[i];
    updateTotals();
  }

  function resetAll() {
    if (!confirm('Tout réinitialiser ?')) return;
    quantities.fill(0);
    savingsGoal = 0;
    bankAccounts = [];
    document.getElementById('goal-input').value = 0;
    document.getElementById('bank-name').value = '';
    document.getElementById('bank-amount').value = '';
    denominations.forEach((_, i) => document.getElementById('qty-' + i).value = 0);
    updateTotals();
  }

  // Rendu des lignes
  const container = document.getElementById('rows');
  denominations.forEach((d, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <span class="row-label">${d.label}</span>
      <div class="row-qty">
        <button class="qty-btn" onclick="changeQty(${i}, -1)">−</button>
        <input class="qty-input" id="qty-${i}" type="number" value="${quantities[i]}" oninput="onInput(${i})" />
        <button class="qty-btn" onclick="changeQty(${i}, 1)">+</button>
      </div>
      <span class="row-sub" id="sub-${i}">—</span>
    `;
    container.appendChild(row);
  });

  document.getElementById('goal-input').value = savingsGoal;

  // Comptes bancaires
  function renderBankAccounts() {
    const list = document.getElementById('bank-accounts-list');
    list.innerHTML = '';
    bankAccounts.forEach((acc, idx) => {
      const div = document.createElement('div');
      div.style.padding = '12px';
      div.style.background = '#f8f7f4';
      div.style.borderRadius = '8px';
      div.style.marginBottom = '8px';
      div.innerHTML = `
        <strong>${acc.name}</strong><br>
        <span style="color:var(--accent)">${fmt(acc.amount)}</span>
        <button onclick="removeBankAccount(${idx})" style="float:right;background:none;border:none;color:#c0392b;font-size:18px;">×</button>
      `;
      list.appendChild(div);
    });
  }

  function addBankAccount() {
    const name = document.getElementById('bank-name').value.trim();
    const amount = parseFloat(document.getElementById('bank-amount').value) || 0;
    if (name && amount > 0) {
      bankAccounts.push({ name, amount });
      document.getElementById('bank-name').value = '';
      document.getElementById('bank-amount').value = '';
      renderBankAccounts();
      updateTotals();
    }
  }

  function removeBankAccount(idx) {
    bankAccounts.splice(idx, 1);
    renderBankAccounts();
    updateTotals();
  }

  // Export PDF
  function exportToPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const { totalCoins, totalBills, totalCash, totalBank, grandTotal } = calculateTotals();
    const date = new Date().toLocaleDateString('fr-FR', { day:'2-digit', month:'long', year:'numeric' });

    doc.setFont("helvetica");
    doc.setFontSize(22);
    doc.text("Compter mon cash 💶", 105, 25, { align: "center" });

    doc.setFontSize(11);
    doc.text(`Date : ${date}`, 20, 40);

    let y = 55;
    doc.setFontSize(13);
    doc.text("Détail cash :", 20, y); y += 10;

    denominations.forEach((d, i) => {
      if (quantities[i] > 0) {
        doc.text(`${d.label} × ${quantities[i]} = ${fmt(d.value * quantities[i])}`, 20, y);
        y += 9;
      }
    });

    y += 8;
    doc.text(`Total Pièces : ${fmt(totalCoins)}`, 20, y); y += 9;
    doc.text(`Total Billets : ${fmt(totalBills)}`, 20, y); y += 9;
    doc.setFontSize(15);
    doc.text(`TOTAL CASH : ${fmt(totalCash)}`, 20, y); y += 15;

    if (totalBank > 0) {
      doc.text(`Comptes Bancaires : ${fmt(totalBank)}`, 20, y); y += 12;
    }

    doc.text(`GRAND TOTAL : ${fmt(grandTotal)}`, 20, y); y += 18;

    if (savingsGoal > 0) {
      const perc = Math.round((totalCash / savingsGoal) * 100);
      doc.text(`Objectif d'épargne : ${fmt(savingsGoal)} (${perc} % atteint)`, 20, y);
    }

    doc.save(`cash_${new Date().toISOString().slice(0,10)}.pdf`);
  }

  renderBankAccounts();
  updateTotals();
</script>
</body>
</html>
